# Reads Chiara's Google Scholar profile once a week and saves the numbers
# in data/scholar.json, which the Publications page displays.
# Can also be started by hand: Actions tab > "Update Google Scholar metrics" > Run workflow.
name: Update Google Scholar metrics

on:
  schedule:
    - cron: "17 6 * * 1"   # every Monday, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install scholarly "bibtexparser<2"
      - run: python scripts/update_scholar.py
      - name: Save the new numbers (only if they changed)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/scholar.json
          git diff --cached --quiet || git commit -m "Update Google Scholar metrics"
          git push
